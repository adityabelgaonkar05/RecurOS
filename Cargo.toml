[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.89"

[workspace.dependencies]
ctx-core = { path = "crates/ctx-core" }
ctx-store-sqlite = { path = "crates/ctx-store-sqlite" }
ctx-git = { path = "crates/ctx-git" }
ctx-branch = { path = "crates/ctx-branch" }
ctx-pack = { path = "crates/ctx-pack" }
ctx-app = { path = "crates/ctx-app" }
ctx-mcp = { path = "crates/ctx-mcp" }
ctx-daemon = { path = "crates/ctx-daemon" }
ctx-wire = { path = "crates/ctx-wire" }
ctx-relay = { path = "crates/ctx-relay" }

anyhow = "1"
async-trait = "0.1"
arboard = "3"
axum = "0.8"
getrandom = "0.3"
http-body-util = "0.1"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "net", "macros", "signal", "time", "sync", "process", "io-util"] }
tower = { version = "0.5", features = ["util"] }
blake3 = "1"
base64 = "0.22"
ed25519-dalek = "2"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
url = "2"
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
gethostname = "1"
clap = { version = "4", features = ["derive"] }
rusqlite = { version = "0.37", features = ["bundled"] }
# Defaults include Rustls, SRV/DNS support for Atlas URLs, and the driver's
# compatibility contract. Keeping them intact avoids a subtly broken hosted
# MongoDB configuration.
mongodb = "3.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tempfile = "3"
thiserror = "2"
ulid = { version = "1", features = ["serde"] }
unicode-normalization = "0.1"

[profile.dev]
opt-level = 0

# Keep dependencies optimised even in dev: SQLite and BLAKE3 are painfully
# slow at opt-level 0 and we don't need to debug them.
[profile.dev.package."*"]
opt-level = 2
